apiVersion: v1
kind: ConfigMap
metadata:
  name: timescaledb-init
  namespace: behavior
data:
  001-create-raw-events.sql: |
    CREATE EXTENSION IF NOT EXISTS timescaledb;

    CREATE TABLE IF NOT EXISTS raw_app_events (
        event_id UUID NOT NULL,
        occurred_at TIMESTAMPTZ NOT NULL,
        received_at TIMESTAMPTZ NOT NULL,
        event_type VARCHAR(10) NOT NULL CHECK (event_type IN ('OPEN', 'CLOSE')),
        app VARCHAR(100),
        source VARCHAR(100) NOT NULL,
        device_id VARCHAR(100) NOT NULL,
        kafka_partition INTEGER,
        kafka_offset BIGINT,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        PRIMARY KEY (event_id, occurred_at)
    );

    SELECT create_hypertable(
        'raw_app_events',
        by_range('occurred_at'),
        if_not_exists => TRUE
    );

    CREATE INDEX IF NOT EXISTS raw_app_events_device_time_idx
        ON raw_app_events (device_id, occurred_at DESC);
  002-create-sessionization.sql: |
    CREATE TABLE IF NOT EXISTS active_app_sessions (
        device_id VARCHAR(100) NOT NULL,
        app VARCHAR(100) NOT NULL,
        open_event_id UUID NOT NULL,
        opened_at TIMESTAMPTZ NOT NULL,
        source VARCHAR(100) NOT NULL,
        duplicate_open_count INTEGER NOT NULL DEFAULT 0
            CHECK (duplicate_open_count >= 0),
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        PRIMARY KEY (device_id, app),
        UNIQUE (open_event_id)
    );

    CREATE TABLE IF NOT EXISTS app_usage_sessions (
        session_id UUID PRIMARY KEY,
        device_id VARCHAR(100) NOT NULL,
        app VARCHAR(100) NOT NULL,
        source VARCHAR(100) NOT NULL,
        open_event_id UUID NOT NULL UNIQUE,
        close_event_id UUID,
        opened_at TIMESTAMPTZ NOT NULL,
        closed_at TIMESTAMPTZ,
        duration_milliseconds BIGINT,
        status VARCHAR(20) NOT NULL
            CHECK (status IN ('COMPLETED', 'ABANDONED')),
        duplicate_open_count INTEGER NOT NULL DEFAULT 0
            CHECK (duplicate_open_count >= 0),
        finalized_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        CHECK (
            (status = 'COMPLETED'
                AND close_event_id IS NOT NULL
                AND closed_at IS NOT NULL
                AND duration_milliseconds IS NOT NULL
                AND duration_milliseconds >= 0)
            OR
            (status = 'ABANDONED'
                AND close_event_id IS NULL
                AND closed_at IS NULL
                AND duration_milliseconds IS NULL)
        )
    );

    CREATE INDEX IF NOT EXISTS app_usage_sessions_device_app_opened_idx
        ON app_usage_sessions (device_id, app, opened_at DESC);

    CREATE TABLE IF NOT EXISTS app_usage_event_anomalies (
        event_id UUID PRIMARY KEY,
        occurred_at TIMESTAMPTZ NOT NULL,
        device_id VARCHAR(100) NOT NULL,
        app VARCHAR(100),
        event_type VARCHAR(10) NOT NULL
            CHECK (event_type IN ('OPEN', 'CLOSE')),
        anomaly_type VARCHAR(40) NOT NULL
            CHECK (anomaly_type IN (
                'DUPLICATE_OPEN',
                'UNMATCHED_CLOSE',
                'OUT_OF_ORDER_CLOSE'
            )),
        active_open_event_id UUID,
        detected_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS app_usage_event_anomalies_device_time_idx
        ON app_usage_event_anomalies (device_id, occurred_at DESC);
  003-create-usage-rollups.sql: |
    CREATE TABLE IF NOT EXISTS app_usage_rollups (
        device_id VARCHAR(100) NOT NULL,
        app VARCHAR(100) NOT NULL,
        granularity VARCHAR(10) NOT NULL
            CHECK (granularity IN ('MINUTE', 'HOUR', 'DAY')),
        bucket_timezone VARCHAR(64) NOT NULL,
        bucket_start TIMESTAMPTZ NOT NULL,
        usage_milliseconds BIGINT NOT NULL
            CHECK (usage_milliseconds >= 0),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        PRIMARY KEY (
            device_id,
            app,
            granularity,
            bucket_timezone,
            bucket_start
        )
    );

    SELECT create_hypertable(
        'app_usage_rollups',
        by_range('bucket_start'),
        if_not_exists => TRUE
    );

    CREATE INDEX IF NOT EXISTS app_usage_rollups_lookup_idx
        ON app_usage_rollups (
            device_id,
            app,
            granularity,
            bucket_timezone,
            bucket_start DESC
        );
  004-create-app-icons.sql: |
    -- App Store icon per app, filled by the stream processor's icon lookup job.
    -- source: 'itunes' (matched), 'none' (no match yet; retried later), or
    -- 'manual' (set by hand; never overwritten by the lookup job).
    CREATE TABLE IF NOT EXISTS app_icons (
        app VARCHAR(100) PRIMARY KEY,
        icon_url TEXT,
        source VARCHAR(20) NOT NULL
            CHECK (source IN ('itunes', 'manual', 'none')),
        looked_up_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
  005-create-pipeline-notify.sql: |
    -- Announces newly stored activity on channel "pipeline_events" so the
    -- analytics API can animate it live on the dashboard's pipeline page:
    -- each new OPEN event (with its app) and each completed session (a CLOSE,
    -- with the app and duration). Duplicate/replayed events don't fire, because
    -- their inserts are skipped by ON CONFLICT DO NOTHING. NOTIFY is delivered
    -- only when the writing transaction commits.
    --
    -- One function per table: raw_app_events is a hypertable whose rows land in
    -- chunk tables, so a trigger can't branch on TG_TABLE_NAME.
    CREATE OR REPLACE FUNCTION notify_pipeline_open() RETURNS trigger AS $$
    BEGIN
        IF NEW.event_type = 'OPEN' AND NEW.app IS NOT NULL THEN
            PERFORM pg_notify('pipeline_events', json_build_object(
                'kind', 'OPEN', 'app', NEW.app, 'deviceId', NEW.device_id, 'at', NEW.occurred_at)::text);
        END IF;
        RETURN NULL;
    END;
    $$ LANGUAGE plpgsql;

    CREATE OR REPLACE FUNCTION notify_pipeline_session() RETURNS trigger AS $$
    BEGIN
        IF NEW.status = 'COMPLETED' THEN
            PERFORM pg_notify('pipeline_events', json_build_object(
                'kind', 'CLOSE', 'app', NEW.app, 'deviceId', NEW.device_id, 'at', NEW.closed_at,
                'durationMilliseconds', NEW.duration_milliseconds)::text);
        END IF;
        RETURN NULL;
    END;
    $$ LANGUAGE plpgsql;

    DROP TRIGGER IF EXISTS raw_app_events_notify ON raw_app_events;
    CREATE TRIGGER raw_app_events_notify AFTER INSERT ON raw_app_events
        FOR EACH ROW EXECUTE FUNCTION notify_pipeline_open();

    DROP TRIGGER IF EXISTS app_usage_sessions_notify ON app_usage_sessions;
    CREATE TRIGGER app_usage_sessions_notify AFTER INSERT ON app_usage_sessions
        FOR EACH ROW EXECUTE FUNCTION notify_pipeline_session();
