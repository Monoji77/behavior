apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: behavior
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: ghcr.io/monoji77/behavior-dashboard:e02d5f5599e2392388baa13be728ff5a922f8f89
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: behavior
spec:
  type: LoadBalancer
  selector:
    app: dashboard
  ports:
    - name: http
      port: 8082
      targetPort: http
