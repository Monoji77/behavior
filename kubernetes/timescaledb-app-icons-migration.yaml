# Creates app_icons in existing databases (new ones get it from
# timescaledb-init). Idempotent, so it is safe on every sync; runs before the
# services that read or write the table are updated.
apiVersion: batch/v1
kind: Job
metadata:
  name: timescaledb-app-icons-migration
  namespace: behavior
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: postgres:17
          imagePullPolicy: IfNotPresent
          env:
            - name: PGHOST
              value: timescaledb
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              valueFrom:
                configMapKeyRef:
                  name: behavior-db-config
                  key: POSTGRES_DB
            - name: PGUSER
              valueFrom:
                configMapKeyRef:
                  name: behavior-db-config
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: behavior-secrets
                  key: POSTGRES_PASSWORD
          command:
            - sh
            - -ec
            - >-
              psql --set=ON_ERROR_STOP=1 -c
              "CREATE TABLE IF NOT EXISTS app_icons (
              app VARCHAR(100) PRIMARY KEY,
              icon_url TEXT,
              source VARCHAR(20) NOT NULL CHECK (source IN ('itunes', 'manual', 'none')),
              looked_up_at TIMESTAMPTZ NOT NULL DEFAULT NOW());"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
