apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-api
  namespace: behavior
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion-api
  template:
    metadata:
      labels:
        app: ingestion-api
    spec:
      containers:
        - name: ingestion-api
          image: ghcr.io/monoji77/behavior-ingestion-api:203a0fddd65535fd71a62331ad8dcdfb2d3a2932
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          env:
            - name: INGESTION_COLLECTOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: behavior-secrets
                  key: INGESTION_COLLECTOR_TOKEN
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka-bootstrap.kafka.svc.cluster.local:9092
            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: behavior-kafka-client
                  key: username
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: behavior-kafka-client
                  key: password
            - name: SPRING_KAFKA_SECURITY_PROTOCOL
              value: SASL_PLAINTEXT
            - name: SPRING_KAFKA_PROPERTIES_SASL_MECHANISM
              value: SCRAM-SHA-512
            - name: SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG
              value: >-
                org.apache.kafka.common.security.scram.ScramLoginModule required
                username="$(KAFKA_USERNAME)" password="$(KAFKA_PASSWORD)";
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-api
  namespace: behavior
spec:
  type: LoadBalancer
  selector:
    app: ingestion-api
  ports:
    - name: http
      port: 18080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-processor
  namespace: behavior
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stream-processor
  template:
    metadata:
      labels:
        app: stream-processor
    spec:
      containers:
        - name: stream-processor
          image: ghcr.io/monoji77/behavior-stream-processor:203a0fddd65535fd71a62331ad8dcdfb2d3a2932
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka-bootstrap.kafka.svc.cluster.local:9092
            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: behavior-kafka-client
                  key: username
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: behavior-kafka-client
                  key: password
            - name: SPRING_KAFKA_SECURITY_PROTOCOL
              value: SASL_PLAINTEXT
            - name: SPRING_KAFKA_PROPERTIES_SASL_MECHANISM
              value: SCRAM-SHA-512
            - name: SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG
              value: >-
                org.apache.kafka.common.security.scram.ScramLoginModule required
                username="$(KAFKA_USERNAME)" password="$(KAFKA_PASSWORD)";
            - name: POSTGRES_HOST
              value: timescaledb
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: behavior-db-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: behavior-db-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: behavior-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
