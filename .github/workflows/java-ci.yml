name: Java CI and container publishing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel obsolete PR checks. Main promotions serialize below and check freshness.
concurrency:
  group: behavior-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: monoji77

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ingestion-api, stream-processor, analytics-api]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml
      - name: Run clean Maven tests
        run: mvn --batch-mode --file services/${{ matrix.service }}/pom.xml clean test

  validate:
    name: Validate deployment manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.4
      - name: Render deployment manifests
        run: kubectl kustomize gitops/behavior > behavior-rendered.yaml
      - name: Validate Kubernetes schemas
        uses: docker://ghcr.io/yannh/kubeconform:v0.7.0
        with:
          args: -strict -summary -kubernetes-version 1.36.0 behavior-rendered.yaml
      - name: Test promotion freshness and conflicts
        run: python3 -m unittest discover -s .github/scripts/tests -v

  build:
    name: Build ${{ matrix.service }}
    needs: [test, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [ingestion-api, stream-processor, analytics-api]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image (publish only from main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/behavior-${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  promote:
    name: Promote published images
    needs: [test, validate, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: behavior-image-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - name: Promote only the current main commit
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python3 .github/scripts/promote.py "$SOURCE_SHA"
