name: Java CI and container publishing

on:
  push:
    paths-ignore:
      - "gitops/behavior/kustomization.yaml"
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: monoji77

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - ingestion-api
          - stream-processor
          - analytics-api

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      - name: Run clean Maven tests
        run: mvn --batch-mode --file services/${{ matrix.service }}/pom.xml clean test

  publish:
    name: Publish ${{ matrix.service }}
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - ingestion-api
          - stream-processor
          - analytics-api

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/behavior-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/behavior-${{ matrix.service }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  promote:
    name: Promote published images
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    concurrency:
      group: behavior-image-promotion
      cancel-in-progress: false

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Pin the release images
        uses: mikefarah/yq@v4.53.3
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          cmd: >-
            yq -i '(.images[] | select(.name == "ghcr.io/monoji77/behavior-ingestion-api") | .newTag) = strenv(IMAGE_TAG) |
            (.images[] | select(.name == "ghcr.io/monoji77/behavior-stream-processor") | .newTag) = strenv(IMAGE_TAG) |
            (.images[] | select(.name == "ghcr.io/monoji77/behavior-analytics-api") | .newTag) = strenv(IMAGE_TAG)'
            gitops/behavior/kustomization.yaml

      - name: Commit the promotion
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git diff --quiet -- gitops/behavior/kustomization.yaml && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/behavior/kustomization.yaml
          git commit -m "Promote behavior images to ${IMAGE_TAG}"
          git push
