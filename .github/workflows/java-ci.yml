name: Java CI and container publishing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel obsolete PR checks. Main runs independently recheck freshness.
concurrency:
  group: behavior-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: monoji77

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ingestion-api, stream-processor, analytics-api]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml
      - name: Run clean Maven tests
        run: mvn --batch-mode --file services/${{ matrix.service }}/pom.xml clean test

  dashboard-test:
    name: Test dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: services/dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci --prefix services/dashboard
      - name: Run dashboard tests
        run: npm test --prefix services/dashboard

  validate:
    name: Validate deployment manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.4
      - name: Render deployment manifests
        run: |
          kubectl kustomize gitops/behavior > behavior-rendered.yaml
          kubectl kustomize gitops/behavior-staging > behavior-staging-rendered.yaml
      - name: Validate Kubernetes schemas
        uses: docker://ghcr.io/yannh/kubeconform:v0.7.0
        with:
          args: -strict -summary -kubernetes-version 1.36.0 behavior-rendered.yaml behavior-staging-rendered.yaml
      - name: Install promotion parser
        run: python3 -m pip install PyYAML==6.0.2
      - name: Check container commands survive Kubernetes $$ expansion
        run: python3 .github/scripts/check_container_commands.py behavior-rendered.yaml behavior-staging-rendered.yaml
      - name: Check staging cannot touch production data
        run: python3 .github/scripts/check_staging_isolation.py behavior-staging-rendered.yaml behavior-rendered.yaml
      - name: Test promotion and staging isolation checks
        run: python3 -m unittest discover -s .github/scripts/tests -v

  build:
    name: Build ${{ matrix.service }}
    needs: [test, dashboard-test, validate]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [ingestion-api, stream-processor, analytics-api, dashboard]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build PR image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/behavior-${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  publish:
    name: Publish ${{ matrix.service }}
    needs: [test, dashboard-test, validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [ingestion-api, stream-processor, analytics-api, dashboard]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image (publish only from main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/behavior-${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  promote:
    name: Promote published images to staging
    needs: [test, dashboard-test, validate, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Install promotion parser
        run: python3 -m pip install PyYAML==6.0.2
      - name: Promote only the current main commit
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python3 .github/scripts/promote.py "$SOURCE_SHA" staging
