<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A real-time personal usage analytics platform: Kafka streaming, Spring Boot, TimescaleDB, Kubernetes GitOps, and a live pipeline visualization."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Digital Habits · Chris Yong</title>

    <!-- Open Graph / social link previews (LinkedIn, Slack, iMessage, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Digital Habits" />
    <meta property="og:title" content="Digital Habits — a real-time personal analytics platform" />
    <meta property="og:description" content="An iPhone Shortcut streams real events through Kafka and a Spring Boot pipeline into TimescaleDB, visualized live on this dashboard. Self-hosted on Kubernetes with GitOps via Argo CD." />
    <meta property="og:image" content="https://behavior-dashboard.taildcd567.ts.net/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://behavior-dashboard.taildcd567.ts.net/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Digital Habits — a real-time personal analytics platform" />
    <meta name="twitter:description" content="An iPhone Shortcut streams real events through Kafka and a Spring Boot pipeline into TimescaleDB, visualized live on this dashboard." />
    <meta name="twitter:image" content="https://behavior-dashboard.taildcd567.ts.net/og-image.png" />
    <style>
      #boot-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;background:#0a0d16;transition:opacity .3s ease}
      #boot-splash[data-hidden]{opacity:0;pointer-events:none}
      #boot-splash .boot-spinner{width:2.25rem;height:2.25rem;border-radius:50%;border:3px solid rgba(139,124,255,.25);border-top-color:#8b7cff;animation:boot-spin .8s linear infinite}
      #boot-splash p{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:.85rem;font-weight:600;letter-spacing:.02em;color:#95a1b7}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" role="status" aria-live="polite">
      <div class="boot-spinner" aria-hidden="true"></div>
      <p>Loading Usage Observatory…</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
