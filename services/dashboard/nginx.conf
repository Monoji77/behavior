# Confirmed via production nginx access logs (2026-09-22) that Tailscale
# Funnel forwards the real public visitor IP through X-Forwarded-For,
# rather than exposing only its own relay address -- so that header is
# a trustworthy per-visitor rate-limit key here. $remote_addr is the
# fallback for direct LAN/tailnet access, where nginx sees the caller
# itself and no forwarding header is set.
map $http_x_forwarded_for $client_ip {
    ""      $remote_addr;
    default $http_x_forwarded_for;
}

# An app switch costs 2 requests (filter-options + dashboard): 60/min with a
# burst of 20 lets someone click through ~10 apps quickly while still capping
# scanners at one request per second.
limit_req_zone $client_ip zone=dashboard_api:10m rate=60r/m;
limit_req_status 429;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location /api/ {
        limit_req zone=dashboard_api burst=20 nodelay;

        proxy_pass http://analytics-api:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
