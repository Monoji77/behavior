apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: behavior
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Monoji77/behavior.git
    targetRevision: deploy/homelab
    path: gitops/behavior
  destination:
    server: https://kubernetes.default.svc
    namespace: behavior
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
