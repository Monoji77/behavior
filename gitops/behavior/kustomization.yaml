apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: behavior
resources:
  - ../../kubernetes
# This cluster does not have the Prometheus Operator ServiceMonitor CRD.
patches:
  - patch: |-
      $patch: delete
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: ingestion-api
        namespace: behavior
  - patch: |-
      $patch: delete
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: analytics-api
        namespace: behavior
# Promote a release by updating all three tags to the same published commit SHA.
images:
  - name: ghcr.io/monoji77/behavior-ingestion-api
    newTag: "20c1787279ad973786947dd6cbb4006b26cb2357"
  - name: ghcr.io/monoji77/behavior-stream-processor
    newTag: "20c1787279ad973786947dd6cbb4006b26cb2357"
  - name: ghcr.io/monoji77/behavior-analytics-api
    newTag: "20c1787279ad973786947dd6cbb4006b26cb2357"
