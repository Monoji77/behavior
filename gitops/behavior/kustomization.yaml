apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: behavior
resources:
  - ../../kubernetes
# This cluster does not have the Prometheus Operator ServiceMonitor CRD.
patches:
  - patch: |-
      $patch: delete
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: ingestion-api
        namespace: behavior
  - patch: |-
      $patch: delete
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: analytics-api
        namespace: behavior
  # Production's dashboard is public (Tailscale Funnel): stream live activity
  # without app names, icons or device. Staging (tailnet-only) shows them.
  - target:
      kind: Deployment
      name: analytics-api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LIVE_ANONYMOUS
          value: "true"
# Promote a release by updating all four tags to the same published commit SHA.
images:
  - name: ghcr.io/monoji77/behavior-ingestion-api
    newTag: "e02d5f5599e2392388baa13be728ff5a922f8f89"
  - name: ghcr.io/monoji77/behavior-stream-processor
    newTag: "e02d5f5599e2392388baa13be728ff5a922f8f89"
  - name: ghcr.io/monoji77/behavior-analytics-api
    newTag: "e02d5f5599e2392388baa13be728ff5a922f8f89"
  - name: ghcr.io/monoji77/behavior-dashboard
    newTag: "e02d5f5599e2392388baa13be728ff5a922f8f89"
