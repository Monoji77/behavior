apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: behavior-staging
resources:
- ../../kubernetes
patches:
- patch: "$patch: delete\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name:\
    \ ingestion-api\n  namespace: behavior"
- patch: "$patch: delete\napiVersion: v1\nkind: Service\nmetadata:\n  name: ingestion-api\n\
    \  namespace: behavior"
- patch: "$patch: delete\napiVersion: v1\nkind: Service\nmetadata:\n  name: ingestion-api-metrics\n\
    \  namespace: behavior"
- patch: "$patch: delete\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name:\
    \ stream-processor\n  namespace: behavior"
- patch: "$patch: delete\napiVersion: batch/v1\nkind: Job\nmetadata:\n  name: timescaledb-close-events-migration\n\
    \  namespace: behavior"
- patch: "$patch: delete\napiVersion: monitoring.coreos.com/v1\nkind: ServiceMonitor\n\
    metadata:\n  name: ingestion-api\n  namespace: behavior"
- patch: "$patch: delete\napiVersion: monitoring.coreos.com/v1\nkind: ServiceMonitor\n\
    metadata:\n  name: analytics-api\n  namespace: behavior"
- target:
    kind: Deployment
    name: analytics-api
  patch: "- op: replace\n  path: /spec/template/spec/containers/0/env/0/value\n  value:\
    \ timescaledb.behavior.svc.cluster.local"
- target:
    kind: Service
    name: dashboard
  patch: "- op: replace\n  path: /spec/ports/0/port\n  value: 8092"
images:
- name: ghcr.io/monoji77/behavior-ingestion-api
  newTag: 82f5965d23cacb51c225469339affc97d5f96d51
- name: ghcr.io/monoji77/behavior-stream-processor
  newTag: 82f5965d23cacb51c225469339affc97d5f96d51
- name: ghcr.io/monoji77/behavior-analytics-api
  newTag: 82f5965d23cacb51c225469339affc97d5f96d51
- name: ghcr.io/monoji77/behavior-dashboard
  newTag: 82f5965d23cacb51c225469339affc97d5f96d51
